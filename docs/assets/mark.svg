<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MKR Code">
  <title>MKR Code</title>
  <!-- Containment ring, broken in four places: the air gap. -->
  <rect x="3" y="3" width="58" height="58" rx="14"
        fill="none" stroke="#14B8A6" stroke-width="2.5"
        stroke-dasharray="38 14" stroke-dashoffset="19" opacity="0.5"/>
  <!-- Terminal body. -->
  <rect x="10" y="10" width="44" height="44" rx="11" fill="#0F172A"/>
  <!-- Prompt chevron. -->
  <path d="M21.5 24.5 L28.5 31.5 L21.5 38.5"
        fill="none" stroke="#2DD4BF" stroke-width="3.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor. -->
  <rect x="32.5" y="35.4" width="11.5" height="3.4" rx="1.7" fill="#2DD4BF"/>
</svg>
